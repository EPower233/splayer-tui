[package]
name = "probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "摸底实验 T-2：用 ncm-api-rs 走通扫码登录到逐字歌词"

[dependencies]
ncm-api-rs = { path = "../ncm-api-rs" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
serde_urlencoded = "0.7"
aes = "0.8"
ecb = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
x25519-dalek = "2"
base64 = "0.22"
rand = "0.8"
hex = "0.4"
flate2 = "1"
anyhow = "1"
qrcode = { version = "0.14", default-features = false }
crossterm = "0.29"
amll-lyric = { version = "0.3", default-features = false, features = ["lrc", "yrc"] }
