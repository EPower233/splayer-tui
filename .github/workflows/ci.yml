name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Set up your toolchain here with dependency caching, for example
      # actions/setup-python@v5, actions/setup-node@v4, actions/setup-go@v5 or dtolnay/rust-toolchain@stable.
      - run: ./scripts/check.sh

  # Slow checks run in their own job so they never delay the fast feedback above.
  # integration:
  #   runs-on: ubuntu-latest
  #   needs: check
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: ./scripts/integration.sh
