# 摸底实验 T-1 的独立 workspace，不属于根 workspace。
# [workspace.dependencies] 和 lints 照抄 SPlayer-Next 根 Cargo.toml @ a8716df，
# 只把 napi、napi-derive、napi-build 换成本目录下的普通 Rust 替身。
[workspace]
members = ["engine", "napi-shim", "napi-derive-shim", "napi-build-shim", "play", "diag"]
resolver = "3"

[workspace.dependencies]
napi = { path = "napi-shim" }
napi-derive = { path = "napi-derive-shim" }
napi-build = { path = "napi-build-shim" }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["macros", "formatting"] }
tokio = { version = "1" }
windows = "0.62"
windows-core = "0.62.2"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
redundant_clone = "deny"
needless_collect = "warn"
large_enum_variant = "warn"
collapsible_if = "allow"
redundant_pattern_matching = "allow"

[profile.release]
lto = true
strip = "symbols"
