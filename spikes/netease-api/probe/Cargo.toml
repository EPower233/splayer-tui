[package]
name = "probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "摸底实验 T-2：用 ncm-api-rs 走通扫码登录到逐字歌词"

[dependencies]
ncm-api-rs = { path = "../ncm-api-rs" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
anyhow = "1"
qrcode = { version = "0.14", default-features = false }
crossterm = "0.29"
amll-lyric = { version = "0.3", default-features = false, features = ["lrc", "yrc"] }
